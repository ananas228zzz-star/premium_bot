<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Premium Tasks</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0714;--card:#151022;--line:#2a1f45;--text:#f3eeff;--muted:#9a8fb8;
  --p1:#7c3aed;--p2:#a855f7;--ok:#34d399;--warn:#fbbf24;
  --glow:0 0 20px rgba(168,85,247,.45);
}
html,body{background:var(--bg)}
body{
  background:radial-gradient(120% 55% at 50% -10%,#32125f 0%,transparent 70%),var(--bg);
  background-repeat:no-repeat;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
  padding:18px 16px calc(100px + env(safe-area-inset-bottom));
}
.header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:var(--glow);
}
.header h1{font-size:19px;font-weight:700}
.header p{font-size:13px;color:var(--muted);margin-top:2px}
.card{
  background:linear-gradient(180deg,#1a1230,var(--card));
  border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}
.card.locked{opacity:.6}
.card h2{font-size:17px;font-weight:700;margin-bottom:10px}
.badge{
  display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;
  background:rgba(168,85,247,.15);color:#d8b4fe;border:1px solid rgba(168,85,247,.4);
}
.badge.ok{background:rgba(52,211,153,.12);color:var(--ok);border-color:rgba(52,211,153,.4)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px;line-height:1.5}
.notice{
  margin-bottom:14px;padding:13px 14px;border-radius:14px;font-size:14px;line-height:1.5;
  background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);color:var(--warn);
}
.btn{
  width:100%;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:var(--glow);
  cursor:pointer;transition:transform .12s,opacity .12s;margin-top:10px;
}
.btn:active{transform:scale(.97);opacity:.9}
.btn.ghost{background:transparent;border:1px solid var(--p2);box-shadow:none;color:#d8b4fe}
.btn.lock{background:#241a3d;box-shadow:none;color:var(--muted)}
.btns{display:flex;gap:10px}
.btns .btn{margin-top:10px}
.bar{height:12px;border-radius:999px;background:#241a3d;overflow:hidden;margin:6px 0 8px}
.bar i{
  display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--p1),var(--p2));box-shadow:var(--glow);
  transition:width .5s ease;
}
.count{font-size:28px;font-weight:800}
.count span{font-size:16px;color:var(--muted);font-weight:600}
.left{font-size:14px;color:#d8b4fe;margin-bottom:6px}
.link{
  margin-top:14px;padding:12px;border-radius:12px;background:#0f0a1d;border:1px dashed var(--p1);
  font-size:13px;color:#d8b4fe;word-break:break-all;
}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:15px}
.gate{text-align:center;padding:10px 0}
.gate .big{font-size:56px;margin-bottom:10px}
.tabs{
  position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(11,7,20,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);
}
.tab{
  flex:1;border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:12px;
  font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
}
.tab b{font-size:19px;font-weight:400}
.tab.active{color:#fff;background:rgba(168,85,247,.18);box-shadow:inset 0 0 0 1px rgba(168,85,247,.5)}
.toast{
  position:fixed;left:50%;top:18px;transform:translate(-50%,-90px);
  background:#241a3d;border:1px solid var(--p2);color:#fff;padding:12px 18px;border-radius:14px;
  font-size:14px;box-shadow:var(--glow);transition:transform .3s;z-index:10;max-width:90%;text-align:center;
}
.toast.show{transform:translate(-50%,0)}
.loader{text-align:center;color:var(--muted);padding:60px 0}
</style>
</head>
<body>
<div class="header">
  <div class="logo">💎</div>
  <div>
    <h1>Premium Tasks</h1>
    <p id="hello">Загрузка...</p>
  </div>
</div>

<div id="app"><div class="loader">Загрузка...</div></div>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="new"><b>✨</b>Новые</button>
  <button class="tab" data-tab="active"><b>⏳</b>Выполняются</button>
  <button class="tab" data-tab="support"><b>💬</b>Поддержка</button>
</nav>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor("#0b0714"); tg.setBackgroundColor("#0b0714"); } catch (e) {}
}
const initData = tg ? tg.initData : "";

let state = null;
let tab = "new";
let subscribed = null;
let checking = false;
let lastKey = "";

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove("show"), 2800);
}

function haptic(type) {
  try { tg.HapticFeedback.notificationOccurred(type); } catch (e) {}
}

async function api(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(Object.assign({init_data: initData}, body || {}))
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || "Ошибка сервера");
  return data;
}

function openLink(url) {
  try {
    if (tg && url.startsWith("https://t.me/")) tg.openTelegramLink(url);
    else if (tg) tg.openLink(url);
    else window.open(url, "_blank");
  } catch (e) {
    toast("Не удалось открыть ссылку");
  }
}

function openChannel() {
  const link = state.channel_link;
  if (!link) {
    toast("Ссылка на канал не указана");
    return;
  }
  openLink(link);
}

async function sendToChat(path) {
  try {
    await api(path);
    haptic("success");
    toast("Ссылка отправлена в чат с ботом. Закройте приложение и нажмите кнопку");
  } catch (e) {
    toast(e.message);
    haptic("error");
  }
}

function supportUrl() { return "https://t.me/" + state.support.replace("@", ""); }

function activeTask() {
  return state.tasks.find(t => t.status === "in_progress") || null;
}

function gateView() {
  return `
    <div class="card gate">
      <div class="big">🔐</div>
      <h2>Подпишитесь на канал</h2>
      <p class="muted">Чтобы пользоваться ботом, подайте заявку на вступление в наш канал. После отправки заявки приложение откроется автоматически.</p>
      <button class="btn" data-action="gate_open">Подписаться на канал</button>
      <button class="btn ghost" data-action="gate_chat">Прислать ссылку в чат</button>
      <button class="btn ghost" data-action="gate_check">Я отправил заявку</button>
    </div>`;
}

function taskNew(t, busy) {
  return `
    <div class="card ${busy ? "locked" : ""}">
      <div class="row"><h2 style="margin:0">${esc(t.title)}</h2></div>
      <span class="badge">🎁 ${esc(t.reward)}</span>
      <p class="muted" style="margin-top:12px">Пригласите ${t.required} человек по своей ссылке и получите ${esc(t.reward)}.</p>
      ${busy
        ? `<button class="btn lock" data-action="locked">🔒 Сначала выполните текущее задание</button>`
        : `<button class="btn" data-action="take" data-id="${t.id}">Взять задание</button>`}
    </div>`;
}

function taskActive(t) {
  const done = t.status === "completed";
  const pct = Math.min(100, Math.round(t.progress / t.required * 100));
  const left = Math.max(0, t.required - t.progress);
  let html = `
    <div class="card">
      <div class="row">
        <h2 style="margin:0">${done ? "" : "Выполняется: "}${esc(t.reward)}</h2>
        <span class="badge ${done ? "ok" : ""}">${done ? "Выполнено" : "В процессе"}</span>
      </div>
      <div class="count">${t.progress}<span> / ${t.required}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>`;
  if (done) {
    html += `<p class="muted" style="margin-top:14px">Вы добавили ${t.required} человек! Подпишитесь на канал и получите ${esc(t.reward)}.</p>`;
    if (subscribed) {
      html += `<div class="link" style="border-color:var(--ok);color:var(--ok)">Подписка подтверждена ✅</div>`;
    } else {
      html += `<button class="btn" data-action="channel">Открыть канал</button>`;
      html += `<button class="btn ghost" data-action="sendlink">Прислать ссылку в чат</button>`;
      if (state.can_check) {
        html += `<button class="btn ghost" data-action="check">Я подписался</button>`;
      }
    }
  } else {
    html += `
      <div class="left">Осталось добавить: <b>${left}</b></div>
      <div class="link" id="reflink">${esc(state.ref_link)}</div>
      <div class="btns">
        <button class="btn" data-action="copy">Копировать</button>
        <button class="btn ghost" data-action="share">Поделиться</button>
      </div>`;
  }
  return html + `</div>`;
}

function render() {
  const app = document.getElementById("app");
  const tabs = document.getElementById("tabs");
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  if (!state) return;
  document.getElementById("hello").textContent = "Привет, " + state.name + "!";

  if (state.gate_required && !state.gate_passed) {
    tabs.style.display = "none";
    app.innerHTML = gateView();
    return;
  }
  tabs.style.display = "flex";

  if (tab === "new") {
    const list = state.tasks.filter(t => t.status === "new");
    const current = activeTask();
    if (!list.length) {
      app.innerHTML = `<div class="empty">Новых заданий пока нет.</div>`;
    } else {
      const notice = current
        ? `<div class="notice">Сначала выполните текущее задание: ${esc(current.reward)} (осталось добавить ${Math.max(0, current.required - current.progress)})</div>`
        : "";
      app.innerHTML = notice + list.map(t => taskNew(t, !!current)).join("");
    }
  } else if (tab === "active") {
    const list = state.tasks.filter(t => t.status !== "new");
    app.innerHTML = list.length ? list.map(taskActive).join("") : `<div class="empty">У вас нет выполняемых заданий.</div>`;
  } else {
    app.innerHTML = `
      <div class="card">
        <h2>Поддержка</h2>
        <p class="muted">По всем вопросам пишите: ${esc(state.support)}</p>
        <button class="btn" data-action="support">Написать в поддержку</button>
      </div>`;
  }
}

async function checkSub(silent) {
  try {
    const r = await api("/api/check_sub");
    subscribed = r.subscribed;
    if (!silent) {
      toast(r.subscribed ? "Подписка подтверждена ✅" : "Вы ещё не подписаны на канал");
      haptic(r.subscribed ? "success" : "warning");
    }
  } catch (e) {
    if (silent) subscribed = false;
    else toast(e.message);
  }
  render();
}

async function load(silent) {
  try {
    const res = await api("/api/state");
    const key = JSON.stringify(res);
    state = res;
    if (key !== lastKey) {
      lastKey = key;
      render();
    }
    const hasDone = state.tasks.some(t => t.status === "completed");
    if (hasDone && state.can_check && subscribed === null && !checking) {
      checking = true;
      checkSub(true).finally(() => { checking = false; });
    }
  } catch (e) {
    if (!silent) document.getElementById("app").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
}

document.addEventListener("click", async ev => {
  const tabBtn = ev.target.closest(".tab");
  if (tabBtn) {
    tab = tabBtn.dataset.tab;
    render();
    return;
  }
  const btn = ev.target.closest("[data-action]");
  if (!btn || !state) return;
  const action = btn.dataset.action;

  if (action === "gate_open") {
    openLink(state.gate_link);
  } else if (action === "gate_chat") {
    sendToChat("/api/send_gate");
  } else if (action === "gate_check") {
    await load(true);
    if (state.gate_passed) {
      haptic("success");
    } else {
      toast("Заявка не найдена. Сначала подайте заявку в канал");
      haptic("warning");
    }
  } else if (action === "locked") {
    toast("Сначала выполните текущее задание");
    haptic("warning");
  } else if (action === "take") {
    btn.disabled = true;
    try {
      state = await api("/api/take", {task_id: Number(btn.dataset.id)});
      lastKey = JSON.stringify(state);
      tab = "active";
      haptic("success");
      toast("Задание взято!");
      render();
    } catch (e) {
      toast(e.message);
      haptic("error");
      load(true);
    }
  } else if (action === "copy") {
    await copyText(state.ref_link);
    haptic("success");
    toast("Ссылка скопирована 📋");
  } else if (action === "share") {
    const text = encodeURIComponent("Выполняй задания и получай Telegram Premium!");
    openLink("https://t.me/share/url?url=" + encodeURIComponent(state.ref_link) + "&text=" + text);
  } else if (action === "channel") {
    openChannel();
  } else if (action === "sendlink") {
    sendToChat("/api/send_channel");
  } else if (action === "check") {
    checkSub(false);
  } else if (action === "support") {
    openLink(supportUrl());
  }
});

if (!initData) {
  document.getElementById("hello").textContent = "";
  document.getElementById("tabs").style.display = "none";
  document.getElementById("app").innerHTML = `<div class="empty">Откройте приложение через Telegram-бота.</div>`;
} else {
  load(false);
  setInterval(() => { if (!document.hidden) load(true); }, 5000);
}
</script>
</body>
</html>
